
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #FAF7F1;
  font-family: Georgia, serif;
  color: #806B4D;
  text-align: center;
  padding: 15px;
}
h2 {
  font-weight: normal;
  letter-spacing: 3px;
}
.wishes {
  height: 280px;
  overflow-y: auto;
  overscroll-behavior: contain;
  border: 1px solid #D8C9B4;
  border-radius: 12px;
  padding: 15px;
}
.wish {
  background: #FFFDF9;
  border-radius: 9px;
  padding: 22px 15px;
  margin-bottom: 12px;
  line-height: 1.7;
}
.name {
  font-size: 14px;
  font-weight: bold;
}
</style>
</head>
<body>
<h2>YOUR WISHES ♡</h2>
<p>Những lời thương gửi đến chúng mình</p>

<div class="wishes">
  <div class="wish">
    Chúc hai bạn trăm năm hạnh phúc! ♡
    <p class="name">— Ngọc Anh</p>
  </div>
  <div class="wish">
    Chúc cô dâu chú rể mãi yêu thương nhau!
    <p class="name">— Minh Thư</p>
  </div>
  <div class="wish">
    Mong hai bạn luôn hạnh phúc và bình an!
    <p class="name">— Hoàng Anh</p>
  </div>
  <div class="wish">
    Chúc hai bạn một đời viên mãn!
    <p class="name">— Khánh Linh</p>
  </div>
</div>
</body>
</html>
